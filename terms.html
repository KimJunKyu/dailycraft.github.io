<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>利用規約一覧 | DailyCraft</title>
    <style>
        :root {
            --primary: #2563EB;
            --primary-light: #EFF6FF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --bg-body: #F8FAFC;
            --bg-card: #FFFFFF;
            --border-color: #E2E8F0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.75;
            padding: 24px 16px;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }
        header {
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 24px;
            margin-bottom: 32px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        h1 {
            font-size: 1.85rem;
            color: #0F172A;
            margin-bottom: 8px;
        }
        .desc {
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .terms-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 32px 0;
        }
        .terms-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .terms-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
            background: #FFFFFF;
        }
        .terms-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0F172A;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .app-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
            background: #FFFFFF;
        }
        .terms-arrow {
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: bold;
        }
        footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.88rem;
        }
    </style>
</head>
<body>
    <div class="container">

        </header>

        <section>
            <div class="terms-grid">
                <a href="terms-kishiwada.html" class="terms-card">
                    <div class="terms-title">
                        <img src="icon_kishiwada.png" onerror="this.src='https://lh3.googleusercontent.com/d0xXGU_1J_2I6vSm11TkM7JaMvPiz6yp5r8wI36mMtnHSkBfQYvFbT5xUranvx_MEzy8xrVPJMCyJiK9zrWe'" alt="岸和田市ごみ分別 アイコン" class="app-icon">
                        <span>「岸和田市ごみ分別」利用規約</span>
                    </div>
                    <span class="terms-arrow">→</span>
                </a>

                <a href="terms-sakai.html" class="terms-card">
                    <div class="terms-title">
                        <img src="https://lh3.googleusercontent.com/MnjqJXv4_tlj91RFnYusrH9iIYwx6cJGdgiphDorPCXeUW06ePjAmU5qhPtXNzfeeIx9P2B59jz9ZIg_DPrOZt8" alt="堺市ゴミ分別 アイコン" class="app-icon">
                        <span>「堺市ゴミ分別」利用規約</span>
                    </div>
                    <span class="terms-arrow">→</span>
                </a>

                <a href="terms-gooddeal.html" class="terms-card">
                    <div class="terms-title">
                        <img src="icon_gooddeal.jpg" alt="価格検索：どちらがお得 アイコン" class="app-icon">
                        <span>「価格検索：どちらがお得」利用規約</span>
                    </div>
                    <span class="terms-arrow">→</span>
                </a>
            </div>
        </section>

        <footer>
            <div style="margin-bottom: 12px;">
                <a href="privacy-policy.html" style="color: var(--primary); text-decoration: none; font-size: 0.9rem;">プライバシーポリシーはこちら</a>
            </div>
            <p>&copy; 2026 DailyCraft. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
